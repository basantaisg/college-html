<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <h1>My Todo List</h1>
    </nav>
  </header>

  <main class="container">
    <section class="todo-card">
      <h2>All Todos</h2>

      <ol class="todo-list" type="a">
        <li class="todo-item">Hand copy premium work</li>
        <li class="todo-item">go to the gym</li>
        <li class="todo-item">send 20 outreach</li>
      </ol>

      <div class="card-actions">
        <button type="button" class="edit-btn">Edit</button>
      </div>
    </section>
  </main>

  <button type="button" class="add-btn" aria-label="Add todo">+</button>
</body>
</html>
